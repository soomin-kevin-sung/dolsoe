[package]
name = "local-llm-wiki-desktop"
version = "0.1.0"
description = "Local-first desktop interface for Local LLM Wiki"
authors = ["Local LLM Wiki contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
crossbeam-channel.workspace = true
futures-util = "0.3"
llm-runtime = { path = "../../../crates/llm-runtime" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
semver = "1"
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
uuid = { version = "1.24.0", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
