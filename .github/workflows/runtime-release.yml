name: runtime release

on:
  push:
    tags: ['runtime-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: CPU
            artifact: cpu
          - backend: VULKAN
            artifact: vulkan
          - backend: CUDA
            artifact: cuda
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Resolve release version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.Replace('runtime-v', '') }
          "LLW_RUNTIME_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build bridge and assemble official llama.cpp DLL pack
        shell: pwsh
        run: scripts/build-runtime-release.ps1 -Version $env:LLW_RUNTIME_VERSION -Backend ${{ matrix.backend }} -OutputRoot .runtime-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.artifact }}
          path: .runtime-release/*.zip
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      LLW_RUNTIME_SIGNING_KEY: ${{ secrets.LLW_RUNTIME_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runtime-*
          path: .runtime-release
          merge-multiple: true
      - name: Resolve release metadata
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.Replace('runtime-v', '') }
          "LLW_RUNTIME_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LLW_RUNTIME_TAG=runtime-v$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Sign exact runtime manifest bytes
        shell: pwsh
        run: scripts/generate-runtime-manifest.ps1 -Version $env:LLW_RUNTIME_VERSION -AssetDirectory .runtime-release -OutputDirectory .runtime-release
      - name: Publish immutable GitHub Release
        shell: bash
        run: |
          if gh release view "$LLW_RUNTIME_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $LLW_RUNTIME_TAG" >&2
            exit 1
          fi
          gh release create "$LLW_RUNTIME_TAG" .runtime-release/*.zip .runtime-release/runtime-manifest.json .runtime-release/runtime-manifest.json.sig .runtime-release/runtime-manifest.public-key \
            --target "$GITHUB_SHA" \
            --title "Runtime packs $LLW_RUNTIME_VERSION" \
            --notes "Signed Windows x64 runtime packs for Local LLM Wiki."
