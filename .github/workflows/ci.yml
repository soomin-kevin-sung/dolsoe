name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      vulkan_compile_smoke:
        description: Assemble the official llama.cpp Vulkan DLL pack
        required: true
        type: boolean
        default: false
      cuda_compile_smoke:
        description: Assemble the official llama.cpp CUDA 12.4 DLL pack
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-cpu-contract:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop
      - name: Build frontend
        run: npm run build --prefix apps/desktop
      - name: Test runtime release packaging contract
        shell: pwsh
        run: scripts/tests/runtime-release.Tests.ps1
      - name: Cache checksum-pinned CPU test model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .test-models/tiny-random-f16.gguf
          key: tiny-random-f16-1010fc48b2a1880a01fa5e267eb35bf586e3e3ad5539ff5b0e025e4f63616a82
      - name: Acquire checksum-pinned test model
        shell: pwsh
        run: |
          $path = & scripts/acquire-test-model.ps1
          "LLW_TEST_GGUF=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build, test, and stage CPU runtime pack
        shell: pwsh
        run: |
          scripts/build-runtime-release.ps1 -Version 0.0.0-ci -Backend CPU -OutputRoot .runtime-release -BuildDirectory .cmake-build/llm-cpu -Configuration Debug
          Expand-Archive .runtime-release/dolsoe-runtime-0.0.0-ci-windows-x86_64-cpu.zip .runtime-packs/cpu-debug
          $pack = '.runtime-packs/cpu-debug'
          $required = 'local_llm_runtime.dll','llama.dll','ggml.dll','ggml-base.dll','llw_runtime_backend_test.exe'
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $pack $_)) }
          if ($missing) { throw "CPU pack is missing: $($missing -join ', ')" }
          if (-not (Get-ChildItem $pack -Filter 'ggml-cpu*.dll')) { throw 'CPU pack has no CPU backend DLL.' }
          $unexpected = 'ggml-cuda.dll','ggml-vulkan.dll' | Where-Object { Test-Path (Join-Path $pack $_) }
          if ($unexpected) { throw "CPU pack has unexpected backend DLLs: $($unexpected -join ', ')" }
          Get-ChildItem -File $pack | Sort-Object Name | Select-Object Name,Length
      - name: Test installed CPU backend
        shell: pwsh
        run: |
          $env:LLW_TEST_BACKEND = 'CPU'
          & .runtime-packs/cpu-debug/llw_runtime_backend_test.exe $env:LLW_TEST_GGUF
          if ($LASTEXITCODE -ne 0) { throw "installed CPU backend test failed: $LASTEXITCODE" }
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Rust with native runtime
        shell: pwsh
        run: |
          $env:LLW_TEST_RUNTIME = (Resolve-Path '.runtime-packs/cpu-debug/local_llm_runtime.dll')
          cargo test --locked --workspace

  windows-vulkan-compile:
    if: github.event_name == 'workflow_dispatch' && inputs.vulkan_compile_smoke
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build bridge and assemble Vulkan pack
        shell: pwsh
        run: scripts/build-runtime-release.ps1 -Version 0.0.0-ci -Backend VULKAN -OutputRoot .runtime-release

  windows-cuda-compile:
    if: github.event_name == 'workflow_dispatch' && inputs.cuda_compile_smoke
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build bridge and assemble CUDA pack
        shell: pwsh
        run: scripts/build-runtime-release.ps1 -Version 0.0.0-ci -Backend CUDA -OutputRoot .runtime-release
