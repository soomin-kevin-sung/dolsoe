[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/llm-runtime-sys",
  "crates/llm-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
